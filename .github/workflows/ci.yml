name: MLOps Demo CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/yiyi2525/mlops-demo:${{ github.sha }} .

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/yiyi2525/mlops-demo:${{ github.sha }}

  deploy:
    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on:
      - self-hosted
      - Windows
      - X64

    steps:
      - name: Check Kubernetes cluster
        shell: powershell
        run: |
          kubectl config current-context
          kubectl get nodes

      - name: Deploy new image
        shell: powershell
        run: |
          kubectl set image deployment/mlops-demo-api `
            mlops-demo-api=ghcr.io/yiyi2525/mlops-demo:${{ github.sha }}

      - name: Wait for rollout
        shell: powershell
        run: |
          kubectl rollout status deployment/mlops-demo-api --timeout=180s

      - name: Verify deployment
        shell: powershell
        run: |
          kubectl get pods