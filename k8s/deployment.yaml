apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-demo-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mlops-demo-api
  template:
    metadata:
      labels:
        app: mlops-demo-api
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: mlops-demo-api
          image: ghcr.io/yiyi2525/mlops-demo:8337a1852ac5f4881064f62ee83466f8a068b9bd
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: mlops-demo-config
            - secretRef:
                name: mlops-demo-secret
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"